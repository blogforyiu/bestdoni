<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>블로그 소개 - 에코 힐링 정보 커뮤니티</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    .page-wrapper {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .back-home-bar {
      margin-bottom: 24px;
    }
    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #03c75a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(3, 199, 90, 0.2);
    }
    .btn-back-home:hover {
      background: #02a348;
      transform: translateY(-2px);
    }
    .page-container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .page-title {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid #f1f5f9;
    }
    .page-content {
      font-size: 16px;
      color: #334155;
      line-height: 1.8;
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <div class="back-home-bar">
    <a href="index.html" class="btn-back-home">🏠 홈으로 돌아가기</a>
  </div>
  <main class="page-container">
    <h1 class="page-title">블로그 소개</h1>
    <div class="page-content">
      <p>안녕하세요! 본 블로그는 생활 속 유용한 꿀팁, 금융 및 테크 트렌드, IT 스마트폰 활용법 등 독자분들께 꼭 필요한 알짜배기 정보를 전달하기 위해 운영되고 있습니다.</p>
      <p>정확하고 신뢰할 수 있는 정보를 바탕으로 매일 성장하는 블로그가 되겠습니다. 감사합니다.</p>
    </div>
  </main>
</div>

</body>
</html>
