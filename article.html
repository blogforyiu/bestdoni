<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>포스트 상세 - 에코 힐링 정보 커뮤니티</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    /* 상세 페이지 전용 추가 스타일 */
    .article-wrapper {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .back-home-bar {
      margin-bottom: 24px;
    }
    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #03c75a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(3, 199, 90, 0.2);
    }
    .btn-back-home:hover {
      background: #02a348;
      transform: translateY(-2px);
    }
    .article-container {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }
    .article-category {
      font-size: 14px;
      font-weight: 700;
      color: #03c75a;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    .article-title {
      font-size: 28px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .article-date {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid #f1f5f9;
    }
    .article-content {
      font-size: 16px;
      color: #334155;
      line-height: 1.8;
    }
    .article-content h2 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin-top: 36px;
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid #e2e8f0;
    }
    .article-content p {
      margin-bottom: 16px;
    }
    .article-content ul, .article-content ol {
      margin-bottom: 20px;
      padding-left: 24px;
    }
    .article-content li {
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="article-wrapper">
  <!-- 눈에 띄는 홈으로 돌아가기 버튼 -->
  <div class="back-home-bar">
    <a href="index.html" class="btn-back-home">
      🏠 홈으로 돌아가기
    </a>
  </div>

  <!-- 본문 카드 박스 -->
  <main class="article-container" id="article-box">
    <!-- 자바스크립트로 동적 로드됨 -->
    <p style="text-align: center; color: #64748b; padding: 40px 0;">포스트를 불러오는 중입니다...</p>
  </main>
</div>

<script src="data.js"></script>
<script>
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const postId = parseInt(urlParams.get('id'));
    const articleBox = document.getElementById('article-box');

    if (typeof posts !== 'undefined' && postId) {
      const post = posts.find(p => p.id === postId);
      if (post) {
        document.title = `${post.title} - 에코 힐링 정보 커뮤니티`;
        articleBox.innerHTML = `
          <div class="article-category">${post.category}</div>
          <h1 class="article-title">${post.title}</h1>
          <div class="article-date">작성일: ${post.date}</div>
          <div class="article-content">
            ${post.content}
          </div>
        `;
        return;
      }
    }
    articleBox.innerHTML = `
      <h2 style="color: #ef4444; margin-bottom: 10px;">포스트를 찾을 수 없습니다.</h2>
      <p>존재하지 않거나 삭제된 게시글입니다.</p>
      <a href="index.html" class="btn-back-home" style="margin-top: 20px;">홈으로 가기</a>
    `;
  };
</script>
</body>
</html>
